name: e2e install

# Really installs and uninstalls the games on GitHub runners, one job per OS and game.
# Started by hand: Actions -> e2e install -> Run workflow
# (or: gh workflow run e2e.yml -f games=blobby_volley -f platforms=windows,cachyos).
# Every step runs even when an earlier one failed (`if: !cancelled()`), so each job shows what works and what
# doesn't. Failed steps stay red. The job summary has a table of all steps and the smoke start report.
#
# Notes:
# - Windows runners already run as admin, so lan.py doesn't re-launch itself with UAC.
# - windows-2025 is Windows Server, not the desktop edition.
# - windows-11-arm is the Windows 11 desktop, but on arm64: the x64 games run through Windows' x64 emulation.
# - CachyOS runs in a privileged Docker container (bubblewrap for Flatpak, iptables for ufw) as the user
#   "player", because lan.py refuses to run as root on Linux.
# - Actions are pinned to a commit hash, the comment shows the version.

on:
  workflow_dispatch:
    inputs:
      games:
        description: "all, or a comma separated list like game,game"
        default: all
      platforms:
        description: "all, or a comma separated list of windows, windows-11-arm, macos-arm64, macos-intel, cachyos"
        default: all

permissions:
  contents: read

jobs:
  setup:
    runs-on: ubuntu-24.04
    outputs:
      games: ${{ steps.matrix.outputs.games }}
      platforms: ${{ steps.matrix.outputs.platforms }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      # Turns the two inputs into the matrix of the e2e job. An empty image runs the job directly on the runner.
      - id: matrix
        env:
          GAMES: ${{ inputs.games }}
          PLATFORMS: ${{ inputs.platforms }}
        run: |
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import json, os, tomllib

          all_platforms = [
              {"name": "windows", "runner": "windows-2025", "image": "", "options": ""},
              {"name": "windows-11-arm", "runner": "windows-11-arm", "image": "", "options": ""},
              {"name": "macos-arm64", "runner": "macos-15", "image": "", "options": ""},
              {"name": "macos-intel", "runner": "macos-15-intel", "image": "", "options": ""},
              {"name": "cachyos", "runner": "ubuntu-24.04", "image": "cachyos/cachyos:<tag>", "options": "--privileged"},
          ]
          with open("games.toml", "rb") as games_file:
              all_game_ids = list(tomllib.load(games_file))

          def choose(input_name, text, choices):
              wanted = [item.strip() for item in text.split(",") if item.strip()]
              if not wanted or wanted == ["all"]:
                  return choices
              unknown = [item for item in wanted if item not in choices]
              if unknown:
                  separator = ", "
                  raise SystemExit(f"Unknown {input_name}: {separator.join(unknown)}. Choose from: {separator.join(choices)}")
              return wanted

          game_ids = choose("game(s)", os.environ["GAMES"], all_game_ids)
          platform_names = choose("platform(s)", os.environ["PLATFORMS"], [platform["name"] for platform in all_platforms])
          platforms = [platform for platform in all_platforms if platform["name"] in platform_names]
          print("games=" + json.dumps(game_ids))
          print("platforms=" + json.dumps(platforms))
          EOF

  e2e:
    needs: setup
    name: ${{ matrix.platform.name }} / ${{ matrix.game }}
    strategy:
      fail-fast: false
      matrix:
        # The platform list is in the setup job
        platform: ${{ fromJSON(needs.setup.outputs.platforms) }}
        game: ${{ fromJSON(needs.setup.outputs.games) }}
    runs-on: ${{ matrix.platform.runner }}
    # An empty image runs the job directly on the runner
    container:
      image: ${{ matrix.platform.image }}
      options: ${{ matrix.platform.options }}
    timeout-minutes: 90
    env:
      GAME: ${{ matrix.game }}
      PYTHONIOENCODING: utf-8
      PYTHONUNBUFFERED: "1"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        if: matrix.platform.image == ''
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.11"

      - name: Set up CachyOS (packages, user "player", ufw)
        if: matrix.platform.image != ''
        run: |
          pacman -Syu --noconfirm --needed python flatpak ufw sudo xorg-server-xvfb
          # Docker containers have no machine id, which every real install has. Without it flatpak
          # uninstall removes the app but then fails with "Cannot spawn a message bus without a machine-id"
          systemd-machine-id-setup
          useradd --create-home player
          echo "player ALL=(ALL) NOPASSWD: ALL" > /etc/sudoers.d/player
          cp -r "$GITHUB_WORKSPACE" /home/player/lan
          chown -R player:player /home/player/lan
          ufw --force enable || echo "::warning title=ufw::ufw could not be enabled in the container, so the firewall steps only test the 'ufw not active' path"
          echo "LAN_DIR=/home/player/lan" >> "$GITHUB_ENV"
          echo "PY=sudo -u player -H python3" >> "$GITHUB_ENV"

      - name: Set up commands
        if: matrix.platform.image == ''
        run: |
          echo "LAN_DIR=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          echo "PY=python" >> "$GITHUB_ENV"

      # Runs lan.py, keeps its output in logs/<name>.log and turns WARNING and ERROR lines into annotations.
      # The Details and Hint lines stay in the log only, so one failed step gives one annotation, not three.
      - name: Create helper
        run: |
          mkdir -p "$GITHUB_WORKSPACE/logs"
          cat > "$RUNNER_TEMP/lan.sh" <<'EOF'
          name=$1; shift
          cd "$LAN_DIR"
          $PY lan.py "$@" 2>&1 | tee "$GITHUB_WORKSPACE/logs/$name.log"
          status=${PIPESTATUS[0]}
          grep -E "^(WARNING|ERROR):" "$GITHUB_WORKSPACE/logs/$name.log" | while IFS= read -r line; do
            case "$line" in
              ERROR:*) echo "::error title=$name $GAME::$line" ;;
              *) echo "::warning title=$name $GAME::$line" ;;
            esac
          done
          exit "$status"
          EOF
          cat > "$RUNNER_TEMP/check.sh" <<'EOF'
          cd "$LAN_DIR"
          $PY .github/e2e/check_state.py "$GAME" "$1" 2>&1 | tee "$GITHUB_WORKSPACE/logs/check-$1.log"
          exit "${PIPESTATUS[0]}"
          EOF

      - name: Is the game available on this OS?
        id: supported
        run: |
          cd "$LAN_DIR"
          echo "ok=$($PY .github/e2e/check_state.py "$GAME" supported)" >> "$GITHUB_OUTPUT"

      - name: lan.py list
        id: list
        if: ${{ !cancelled() && steps.supported.outputs.ok == 'true' }}
        timeout-minutes: 5
        run: bash "$RUNNER_TEMP/lan.sh" list list

      - name: Install
        id: install
        if: ${{ !cancelled() && steps.supported.outputs.ok == 'true' }}
        timeout-minutes: 20
        run: bash "$RUNNER_TEMP/lan.sh" install install "$GAME"

      - name: Check installed
        id: check_installed
        if: ${{ !cancelled() && steps.supported.outputs.ok == 'true' }}
        timeout-minutes: 5
        run: bash "$RUNNER_TEMP/check.sh" present

      - name: Install again (must be safe to run twice)
        id: install_again
        if: ${{ !cancelled() && steps.supported.outputs.ok == 'true' }}
        timeout-minutes: 20
        run: |
          bash "$RUNNER_TEMP/lan.sh" install-again install "$GAME"
          log="$GITHUB_WORKSPACE/logs/install-again.log"
          if grep -q "==> Remove the old version" "$log" && ! grep -q "same version, kept" "$log"; then
            echo "::warning title=install-again $GAME::The ZIP game folder was not kept on a reinstall of the same version"
          fi

      - name: Check installed after second install
        id: check_installed_again
        if: ${{ !cancelled() && steps.supported.outputs.ok == 'true' }}
        timeout-minutes: 5
        run: bash "$RUNNER_TEMP/check.sh" present

      - name: Smoke start (start the game, record new folders)
        id: smoke
        if: ${{ !cancelled() && steps.supported.outputs.ok == 'true' }}
        continue-on-error: true
        timeout-minutes: 5
        run: |
          cd "$LAN_DIR"
          $PY .github/e2e/smoke_start.py "$GAME" | tee "$GITHUB_WORKSPACE/logs/smoke.md"

      - name: Uninstall
        id: uninstall
        if: ${{ !cancelled() && steps.supported.outputs.ok == 'true' }}
        timeout-minutes: 15
        run: bash "$RUNNER_TEMP/lan.sh" uninstall uninstall "$GAME" --yes

      - name: Check removed
        id: check_removed
        if: ${{ !cancelled() && steps.supported.outputs.ok == 'true' }}
        timeout-minutes: 5
        run: bash "$RUNNER_TEMP/check.sh" absent

      - name: Uninstall again (must be safe to run twice)
        id: uninstall_again
        if: ${{ !cancelled() && steps.supported.outputs.ok == 'true' }}
        timeout-minutes: 15
        run: bash "$RUNNER_TEMP/lan.sh" uninstall-again uninstall "$GAME" --yes

      - name: Summary
        if: always()
        env:
          RESULTS: |
            lan.py list|${{ steps.list.outcome }}
            Install|${{ steps.install.outcome }}
            Check installed|${{ steps.check_installed.outcome }}
            Install again|${{ steps.install_again.outcome }}
            Check installed after second install|${{ steps.check_installed_again.outcome }}
            Smoke start (info only)|${{ steps.smoke.outcome }}
            Uninstall|${{ steps.uninstall.outcome }}
            Check removed|${{ steps.check_removed.outcome }}
            Uninstall again|${{ steps.uninstall_again.outcome }}
        run: |
          {
            echo "## ${{ matrix.platform.name }} / $GAME"
            echo
            if [ "${{ steps.supported.outputs.ok }}" != "true" ]; then
              echo "Not available on this OS (no table in games.toml), skipped."
              exit 0
            fi
            echo "| Step | Result |"
            echo "|---|---|"
            while IFS="|" read -r step outcome; do
              [ -z "$step" ] && continue
              case "$outcome" in
                success) icon="✅" ;; failure) icon="❌" ;; skipped|"") icon="⏭️" ;; *) icon="⚠️" ;;
              esac
              echo "| $step | $icon $outcome |"
            done <<< "$RESULTS"
            echo
            for file in check-present check-absent; do
              if [ -f "logs/$file.log" ]; then
                echo "<details><summary>$file</summary>"
                echo
                echo '```'
                cat "logs/$file.log"
                echo '```'
                echo "</details>"
                echo
              fi
            done
            [ -f logs/smoke.md ] && cat logs/smoke.md
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: ${{ matrix.platform.name }}-${{ matrix.game }}
          path: logs/
          if-no-files-found: ignore