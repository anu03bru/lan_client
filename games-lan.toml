# LAN PARTY COPY of games.toml: the same games, but every file comes from the LAN share instead of the internet.
# Temporary: delete this file (and docs/lan-share.md, scripts/fill_share.py, its test) after the party.
# Use it with:  lan.py --games games-lan.toml install all
# Keep it in sync with games.toml; tests/test_config.py fails when the two differ in anything but the URLs.
# Fill the share with scripts/fill_share.py, see docs/lan-share.md.

# Where the LAN share is opened on each OS. The only thing to change once the share exists.
# %SHARE% in the URLs below is replaced with the value for the current OS. Use / as separator.
#   windows  \\FILESERVER\lanparty, written with /
#   macos    after Finder > Go > Connect to Server > smb://FILESERVER/lanparty
#   linux    after opening smb://FILESERVER/lanparty in the file manager (gvfs; 1000 = the user id, see `id -u`)
[share]
windows = "//FILESERVER/lanparty"
macos = "/Volumes/lanparty"
linux = "/run/user/1000/gvfs/smb-share:server=fileserver,share=lanparty"

# Games for lan.py. One table per game; the table name is the id used on the command line
# (e.g. `./lan.py install supertuxkart`). Values that still need checking on a test machine are listed in
# .claude/open.md.
#
# Game fields
#   name      Display name. Also the ufw rule comment (Linux) and the start of the firewall rule name (Windows),
#             so don't rename a game while it is installed somewhere: uninstall would not find its rules.
#   version   Optional. Warns when the installed Flatpak has a different version (all players need the same one).
#   ports     Optional. Opened on install and closed on uninstall. Only needed by the player who hosts.
#   reply_ports  Optional, Linux only. For games that find LAN servers by broadcast: the host answers from this
#             port, and ufw drops that answer because it can't match it to the broadcast. Install allows incoming
#             packets from this source port, from private LAN addresses only. Needed by every player who searches.
#   hint      Optional. Printed after the install.
#
# [<id>.linux]
#   type = "flatpak"          app_id                    App from Flathub
#     optional: commit = "..."                          Pins the Flathub build (x86_64). Get it from
#                                                       flatpak remote-info --log flathub <app_id>, newest commit
#                                                       whose Version matches `version`
#     optional: bundle = { url, sha256 }                games-lan.toml only: install this .flatpak file (built by
#                                                       scripts/build_flatpak_bundles.py) instead of using Flathub
#   type = "flatpak-bundle"   app_id, url, sha256       A .flatpak file
#   optional: data = [...]                              Extra folders deleted on uninstall
#   optional: requires = ["<runtime id>", ...]          games-lan.toml only: flatpak-runtime bundles installed first
#   optional: [<id>.linux.overrides] env = {...}, filesystem = [...]   Flatpak permissions
#
# [<id>.windows]
#   type = "nsis"   url, sha256, uninstall_name         Silent installer (/S). uninstall_name is matched against
#                                                       the program name in "Apps & features" (* = wildcard).
#                                                       Files the uninstaller leaves behind are deleted when the
#                                                       install folder's name matches uninstall_name too
#   type = "zip"    url, sha256, install_dir            Portable ZIP, extracted into install_dir
#   optional: shortcuts = [{ name, target }]            Desktop shortcuts; target is an .exe inside install_dir
#   optional: data = [...]                              User data folders deleted on uninstall
#   optional: requires = ["<runtime id>", ...]          Runtimes from [runtimes] installed before the game
#   optional: settings = [{ file, values = { key = "value", ... } }]
#                                                       Lines `key = "value"` set in a config file after the
#                                                       install (e.g. 0 A.D.'s user.cfg). Other lines are kept
#
# [<id>.macos]
#   type = "dmg"    url, sha256, apps                   Disk image
#   type = "zip"    url, sha256, apps                   ZIP file
#   apps = ["X.app", ...]                               App bundles in the download (top level or one folder deeper).
#                                                       Copied into ~/Applications, removed on uninstall
#   optional: arm64 = { url, sha256 }                   Separate build for Apple Silicon Macs
#   optional: data = [...]                              User data folders deleted on uninstall
#
# [[<id>.assets]]  url, sha256, extract, linux_dest, windows_dest, macos_dest
#   Extra ZIP downloads. Files matching `extract` (e.g. "*.wad") are copied into the dest folder.
#   The dest folders are deleted on uninstall. macos_dest is only needed when the game has a macos table.
#
# [runtimes.<runtime id>]  ("runtimes" can't be a game id)
#   type = "vcredist-x64"   name, url, sha256, version  Microsoft Visual C++ Redistributable (x64). Installed when
#                                                       it's missing or older than `version` (from the registry),
#                                                       never removed: other programs use it too. Pin a build from
#                                                       https://aka.ms/vs/17/release/vc_redist.x64.exe (it redirects
#                                                       to a fixed URL); version = the exe's file version
#   type = "flatpak-runtime" name, ref, url, sha256     games-lan.toml only: a Flatpak runtime bundle, e.g.
#                                                       ref = "org.freedesktop.Platform//26.08". Installed when no
#                                                       build of that ref is installed yet
#
# Paths: ~ is your home folder. On Windows %APPDATA%, %LOCALAPPDATA%, %USERPROFILE%, %DOCUMENTS% and %DESKTOP%
# can be used. Use / as separator on all systems.
# games-lan.toml (LAN party only) also has a [share] table and %SHARE% in its URLs, see docs/lan-share.md.

[runtimes.vcredist_x64]
type = "vcredist-x64"
name = "Microsoft Visual C++ Redistributable"
url = "%SHARE%/runtimes/VC_redist.x64.exe"
sha256 = "cc0ff0eb1dc3f5188ae6300faef32bf5beeba4bdd6e8e445a9184072096b713b"
version = "14.44.35211"

