# Games for lan.py. One table per game; the table name is the id used on the command line
# (e.g. `./lan.py install supertuxkart`).
#
# Game fields
#   name      Display name. Also the ufw rule comment (Linux) and the start of the firewall rule name (Windows),
#             so don't rename a game while it is installed somewhere: uninstall would not find its rules.
#   version   Optional. Warns when the installed Flatpak has a different version (all players need the same one).
#   ports     Optional. Opened on install and closed on uninstall. Only needed by the player who hosts.
#   hint      Optional. Printed after the install.
#
# [<id>.linux]
#   type = "flatpak"          app_id                    App from Flathub
#   type = "flatpak-bundle"   app_id, url, sha256       A .flatpak file
#   optional: data = [...]                              Extra folders deleted on uninstall
#   optional: [<id>.linux.overrides] env = {...}, filesystem = [...]   Flatpak permissions
#
# [<id>.windows]
#   type = "nsis"   url, sha256, uninstall_name         Silent installer (/S). uninstall_name is matched against
#                                                       the program name in "Apps & features" (* = wildcard)
#   type = "zip"    url, sha256, install_dir            Portable ZIP, extracted into install_dir
#   optional: shortcuts = [{ name, target }]            Desktop shortcuts; target is an .exe inside install_dir
#   optional: data = [...]                              User data folders deleted on uninstall
#
# [[<id>.assets]]  url, sha256, extract, linux_dest, windows_dest
#   Extra ZIP downloads. Files matching `extract` (e.g. "*.wad") are copied into the dest folder.
#   The dest folders are deleted on uninstall.
#
# Paths: ~ is your home folder. On Windows %APPDATA%, %LOCALAPPDATA%, %USERPROFILE%, %DOCUMENTS% and %DESKTOP%
# can be used. Use / as separator on both systems.

[doom]
name = "Doom (Odamex + Freedoom)"
hint = "Multiplayer: start Odalaunch and join the LAN server, or add it manually: <SERVER-IP>:10666"

[doom.linux]
type = "flatpak-bundle"
app_id = "net.odamex.Odamex"
url = "https://github.com/odamex/odamex/releases/download/12.3.0/odamex-linux-x86_64-12.3.0.flatpak"
sha256 = "b5612f397e40847d01e6655adccc309dea9305d9ddc7563ac6296288f1ea94bf"
data = ["~/OdamexLAN"]

[doom.linux.overrides]
env = { DOOMWADDIR = "~/OdamexLAN/wads" }
filesystem = ["~/OdamexLAN/wads:ro"]

[doom.windows]
type = "zip"
url = "https://github.com/odamex/odamex/releases/download/12.3.0/odamex-win64-12.3.0.zip"
sha256 = "4013fa90335a801e6637dd039370f3d15bf321c2b16fda8b3617b7fd0cf1e874"
install_dir = "%LOCALAPPDATA%/OdamexLAN"
shortcuts = [
    { name = "Odamex LAN", target = "odalaunch.exe" },
    { name = "Odamex Singleplayer", target = "odamex.exe" },
]
# TODO: verify on a Windows test machine whether Odamex writes to My Games
data = ["%DOCUMENTS%/My Games/Odamex"]

[[doom.assets]]
url = "https://github.com/freedoom/freedoom/releases/download/v0.13.0/freedm-0.13.0.zip"
sha256 = "b420f13508ef745d7b38e83d15e55e0fc0b09d9a503c96741cddd9773d43f7c9"
extract = "*.wad"
linux_dest = "~/OdamexLAN/wads"
windows_dest = "%LOCALAPPDATA%/OdamexLAN"

[[doom.assets]]
url = "https://github.com/freedoom/freedoom/releases/download/v0.13.0/freedoom-0.13.0.zip"
sha256 = "3f9b264f3e3ce503b4fb7f6bdcb1f419d93c7b546f4df3e874dd878db9688f59"
extract = "*.wad"
linux_dest = "~/OdamexLAN/wads"
windows_dest = "%LOCALAPPDATA%/OdamexLAN"


[blobby_volley]
name = "Blobby Volley 2"
ports = ["1234/udp"]  # default port when hosting a network game

[blobby_volley.linux]
type = "flatpak"
app_id = "de.blobbyvolley.BlobbyVolley2"

[blobby_volley.windows]
type = "zip"
url = "https://sourceforge.net/projects/blobby/files/Blobby%20Volley%202%20(Win32)/1.1.1/blobby2-win32-1.1.1.zip/download"
sha256 = "157b8d340bf89d1a6583d689dbb716099762211944c3ca7b588947b6cd7187ff"
install_dir = "%LOCALAPPDATA%/BlobbyVolley2"
shortcuts = [{ name = "Blobby Volley 2", target = "blobby.exe" }]  # TODO: verify the exe name
# TODO: verify the user data folder on a Windows test machine
data = ["%APPDATA%/blobby", "%APPDATA%/.blobby"]


[0ad]
name = "0 A.D."
version = "0.28.0"
ports = ["20595/udp"]  # used when hosting ("Host Game")
hint = "Multiplayer: one player uses 'Host Game', the others 'Join Game' with the host's IP."

[0ad.linux]
type = "flatpak"
app_id = "com.play0ad.zeroad"

[0ad.windows]
type = "nsis"
# TODO: verify the exact x64 installer URL on releases.wildfiregames.com
url = "https://releases.wildfiregames.com/0ad-0.28.0-win64.exe"
sha256 = "9b5e1a16d4e0df9c84e052f56fb75da69518d5634c88d2b38db69baee63c16a1"
uninstall_name = "0 A.D.*"
data = ["%APPDATA%/0ad", "%LOCALAPPDATA%/0ad", "%DOCUMENTS%/My Games/0ad"]


[supertuxkart]
name = "SuperTuxKart"
version = "1.5"
# 2759 = game server, 2757 = LAN server discovery (needed when hosting via "Create server")
ports = ["2759/udp", "2757/udp"]
hint = "Multiplayer: Online -> Local network. The host uses 'Create server'."

[supertuxkart.linux]
type = "flatpak"
app_id = "net.supertuxkart.SuperTuxKart"

[supertuxkart.windows]
type = "nsis"
url = "https://github.com/supertuxkart/stk-code/releases/download/1.5/SuperTuxKart-1.5-installer-x86_64.exe"
sha256 = "a1260ebb73dd9da13ec3e37f526f29e494b3b66c00c05fd70767b30a4497d95e"
uninstall_name = "SuperTuxKart*"
data = ["%APPDATA%/supertuxkart", "%LOCALAPPDATA%/supertuxkart"]


[assaultcube]
name = "AssaultCube"
hint = "Multiplayer: Multiplayer -> Join a LAN server."

[assaultcube.linux]
type = "flatpak"
app_id = "net.cubers.assault.AssaultCube"

[assaultcube.windows]
type = "nsis"
url = "https://github.com/assaultcube/AC/releases/download/v1.3.0.2/AssaultCube_v1.3.0.2_LockdownEdition.exe"
sha256 = "77eff4497232562eeb1862f97d484777202e8ac42c411093a821234045ee61a5"
uninstall_name = "AssaultCube*"
# TODO: verify the user data folder on a Windows test machine
data = ["%DOCUMENTS%/My Games/AssaultCube"]
